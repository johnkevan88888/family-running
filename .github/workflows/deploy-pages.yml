name: Deploy to GitHub Pages

# Publishes only the built runtime artifact, not the repository root. Before this
# workflow, Pages served the repository directly, so documentation, scripts, and
# configuration were readable at their paths on the live site.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build published site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify vendored libraries match pinned dependencies
        run: pnpm run validate:vendor

      - name: Build published site
        run: pnpm run build:site

      - name: Confirm the custom domain survives into the artifact
        run: |
          test -f test-artifacts/preview-site/CNAME
          echo "CNAME: $(cat test-artifacts/preview-site/CNAME)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload published artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-artifacts/preview-site

  deploy:
    name: Deploy published site
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
