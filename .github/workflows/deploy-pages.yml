name: Deploy to GitHub Pages

# Publishes only the built runtime artifact, not the repository root. Before this
# workflow, Pages served the repository directly, so documentation, scripts, and
# configuration were readable at their paths on the live site.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build published site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify vendored libraries match pinned dependencies
        run: pnpm run validate:vendor

      - name: Build published site
        run: pnpm run build:site

      - name: Confirm the custom domain survives into the artifact
        run: |
          test -f test-artifacts/preview-site/CNAME
          echo "CNAME: $(cat test-artifacts/preview-site/CNAME)"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # include-hidden-files is required, not optional tidiness. From v4 this
      # action excludes dotfiles by default, and the build writes `.nojekyll`
      # into the artifact to stop Pages running Jekyll over the published site.
      # It is the only dotfile published, so leaving the default would silently
      # drop it. The action excludes `.git` and `.github` regardless of this
      # setting, so nothing unwanted is pulled in.
      #
      # Verify after deploying: https://www.aceofrace.com/.nojekyll must return
      # 200. If it 404s, this input stopped working and Jekyll is processing the
      # site.
      - name: Upload published artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: test-artifacts/preview-site
          include-hidden-files: true

  deploy:
    name: Deploy published site
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # v5 is a Node 24 runtime bump. v4 targeted Node 20, which GitHub now
      # forces onto Node 24 with a deprecation warning on every deployment.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
