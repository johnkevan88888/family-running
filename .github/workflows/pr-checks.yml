name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
  workflow_dispatch:
    inputs:
      jobs:
        description: How many checks to run at once. Empty runs them one at a time, as every pull request does.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only a pull_request run may carry the required check's name. A manual
    # dispatch is named differently on purpose, so it can neither satisfy nor
    # block the "Test static site" branch protection, and merge evidence stays
    # the pull_request run on the exact head.
    name: ${{ github.event_name == 'pull_request' && 'Test static site' || 'Manual suite run' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Validate Pull Request release pathway
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-pr-release-path.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select regression scope from exact committed diff
        id: regression
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-gallery-photo-review.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run repository checks
        # Confined to this step, so it cannot reach any other step or any test
        # that spawns the runner itself. Declared before `if:` because the
        # classification guard and `run: pnpm test` must stay adjacent, which
        # tests/gallery-photo-review-path.mjs enforces. Empty on every
        # pull_request run, which the runner reads as unset and so runs one
        # check at a time; only a manual dispatch can widen it.
        env:
          FAMILY_RUNNING_TEST_JOBS: ${{ inputs.jobs }}
        if: steps.regression.outputs.suite != 'photo-only'
        run: pnpm test

      - name: Run focused photo-only checks
        if: steps.regression.outputs.suite == 'photo-only'
        run: node scripts/run-gallery-photo-checks.mjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-screenshots-${{ github.run_id }}
          path: test-artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14

  # Advisory only, and deliberately never named "Test static site".
  #
  # It reports which tier this Pull Request's diff falls into and whether that
  # narrowed set of checks passes. It gates nothing: `continue-on-error` keeps a
  # red result from blocking, branch protection does not require it, and the
  # required check above still runs the whole suite on every Pull Request.
  #
  # The point is evidence. While this runs in shadow, the two jobs' outcomes can
  # be compared on real Pull Requests, and a tier that ever passes where the
  # required job fails is the signal that the tier table is wrong. That has to
  # be observed over many Pull Requests before anyone argues for promoting it.
  tier:
    name: Change tier (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Classify the change
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-change-tier.mjs

      - name: Install Playwright browser
        if: steps.classify.outputs.tier != 'full'
        run: pnpm exec playwright install --with-deps chromium

      # Always runs, so every Pull Request emits exactly one
      # CHANGE_TIER_SUMMARY line for `scripts/collect-tier-agreement.mjs` to
      # read -- including the runs that narrow nothing, which are most of them
      # and still count towards the exit criterion.
      - name: Run the narrowed tier
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/run-change-tier.mjs

