name: Protected batch publication continuation
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing owner-approved batch publication job ID
        required: true
        type: string
      phase:
        description: Prepare the separate owner merge, or observe its verified result
        required: true
        type: choice
        options:
          - prepare
          - observe
permissions:
  contents: read
concurrency:
  group: gallery-archive-publication-purge
  cancel-in-progress: false
jobs:
  continue-publication:
    if: github.repository == 'johnkevan88888/family-running' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gallery-processing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: review-token
        with:
          app-id: ${{ secrets.GALLERY_REVIEW_APP_ID }}
          private-key: ${{ secrets.GALLERY_REVIEW_APP_PRIVATE_KEY }}
          owner: johnkevan88888
          repositories: family-running
          permission-contents: write
          permission-pull-requests: read
      - name: Continue the original held publication using current code
        run: node scripts/run-gallery-batch-publication.mjs
        env:
          GALLERY_ARCHIVE_JOB_ID: ${{ inputs.job_id }}
          GALLERY_PUBLICATION_PHASE: ${{ inputs.phase }}
          GALLERY_BASE_SHA: ${{ github.sha }}
          GALLERY_GITHUB_APP_TOKEN: ${{ steps.review-token.outputs.token }}
          GALLERY_PROMOTION_ORIGIN: ${{ secrets.GALLERY_PROMOTION_ORIGIN }}
          GALLERY_PROMOTION_ACCESS_CLIENT_ID: ${{ secrets.GALLERY_PROMOTION_ACCESS_CLIENT_ID }}
          GALLERY_PROMOTION_ACCESS_CLIENT_SECRET: ${{ secrets.GALLERY_PROMOTION_ACCESS_CLIENT_SECRET }}
